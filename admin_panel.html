<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyMagic - Mockup Test Creator & Supabase Uploader</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="p-4 md:p-8 max-w-5xl mx-auto text-slate-800">

    <!-- Header -->
    <div class="bg-gradient-to-r from-blue-600 to-indigo-700 text-white rounded-2xl p-6 shadow-lg mb-8">
        <div class="flex items-center justify-between">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold flex items-center gap-3">
                    <i class="fa-solid fa-file-pen"></i> StudyMagic Mockup Test Creator
                </h1>
                <p class="text-blue-100 text-sm mt-1">Generate JSON and directly upload Type 1 & Type 2 Mockup Tests to Supabase</p>
            </div>
            <span class="bg-white/20 backdrop-blur-md px-4 py-1.5 rounded-full text-xs font-semibold uppercase tracking-wider">Admin Panel</span>
        </div>
    </div>

    <!-- Main Container -->
    <div class="grid grid-cols-1 gap-8">

        <!-- 1. Supabase Database Configuration -->
        <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
            <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-database text-blue-600"></i> 1. Supabase Connection Credentials
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Supabase Project URL</label>
                    <input type="text" id="sbUrl" value="https://crafyflxsvgjvvuzdftm.supabase.co" placeholder="https://your-project.supabase.co" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Supabase Anon Key</label>
                    <input type="text" id="sbKey" value="sb_publishable_NxzsXWLHPGkNi0jTVx5k1Q_QYoRwGFo" placeholder="eyJhYmdj..." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Table Name</label>
                    <input type="text" id="sbTable" value="mockup_tests" placeholder="mockup_tests" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
            </div>
        </div>

        <!-- 2. Test Basic Info & Type Selector -->
        <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
            <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-[#007acc] fa-sliders text-indigo-600"></i> 2. Test Configuration & Type
            </h2>

            <!-- Type Selection -->
            <div class="mb-6">
                <label class="block text-xs font-semibold text-slate-600 mb-2">Select Mockup Test Type</label>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <label id="lblType1" class="border-2 border-blue-500 bg-blue-50/50 p-4 rounded-xl cursor-pointer flex items-start gap-3 transition">
                        <input type="radio" name="testType" value="type1" checked onchange="handleTypeChange()" class="mt-1 accent-blue-600">
                        <div>
                            <div class="font-bold text-blue-900 text-sm">Type 1: Universal Duration</div>
                            <div class="text-xs text-slate-600 mt-1">One total test duration. Free navigation between subjects.</div>
                        </div>
                    </label>

                    <label id="lblType2" class="border-2 border-slate-200 p-4 rounded-xl cursor-pointer flex items-start gap-3 transition hover:border-slate-300">
                        <input type="radio" name="testType" value="type2" onchange="handleTypeChange()" class="mt-1 accent-blue-600">
                        <div>
                            <div class="font-bold text-slate-800 text-sm">Type 2: Subject-Wise Timed</div>
                            <div class="text-xs text-slate-600 mt-1">Separate timer for each subject. Sectional lock until timeout.</div>
                        </div>
                    </label>
                </div>
            </div>

            <!-- Fields -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Test Title *</label>
                    <input type="text" id="testTitle" placeholder="e.g. SSC CGL Tier 1 Full Mock Test 01" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Test Description</label>
                    <input type="text" id="testDesc" placeholder="e.g. Based on latest TCS pattern with detailed solutions" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div id="divUniversalDuration">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Universal Test Duration (Minutes) *</label>
                    <input type="number" id="universalDuration" value="60" placeholder="60" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Category ID (Optional)</label>
                    <input type="text" id="categoryId" placeholder="e.g. 1" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Topic ID (Optional)</label>
                    <input type="text" id="topicId" placeholder="e.g. t1" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
            </div>
        </div>

        <!-- 3. Subjects & Questions Builder -->
        <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-layer-group text-emerald-600"></i> 3. Subjects & Questions
                </h2>
                <button onclick="addSubjectCard()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-xs font-semibold flex items-center gap-2 transition shadow-sm">
                    <i class="fa-solid fa-plus"></i> Add Subject
                </button>
            </div>

            <!-- Subjects Container -->
            <div id="subjectsContainer" class="space-y-6">
                <!-- Dynamic Subjects will be added here -->
            </div>
        </div>

        <!-- 4. Output Actions -->
        <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
            <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-code text-purple-600"></i> 4. Generate JSON & Upload
            </h2>

            <div class="flex flex-wrap gap-3 mb-4">
                <button onclick="generateJSON()" class="bg-slate-800 hover:bg-slate-900 text-white px-5 py-2.5 rounded-lg text-sm font-semibold flex items-center gap-2 transition">
                    <i class="fa-solid fa-gears"></i> Generate Preview JSON
                </button>
                <button onclick="copyJSON()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-lg text-sm font-semibold flex items-center gap-2 transition">
                    <i class="fa-solid fa-copy"></i> Copy JSON
                </button>
                <button onclick="uploadToSupabase()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2.5 rounded-lg text-sm font-semibold flex items-center gap-2 transition shadow-md">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Direct Upload to Supabase
                </button>
            </div>

            <!-- Status Alert -->
            <div id="statusAlert" class="hidden p-4 rounded-xl text-sm font-medium mb-4"></div>

            <!-- Output Textarea -->
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Generated Output JSON</label>
                <textarea id="outputJson" rows="10" readonly placeholder="Click 'Generate Preview JSON' to view JSON output..." class="w-full p-3 font-mono text-xs bg-slate-900 text-emerald-400 rounded-xl border border-slate-800 outline-none"></textarea>
            </div>
        </div>

    </div>

    <!-- JavaScript Logic -->
    <script>
        let subjectCount = 0;

        // Initialize with 1 default subject
        window.onload = function() {
            addSubjectCard("Mathematics");
        };

        function handleTypeChange() {
            const selectedType = document.querySelector('input[name="testType"]:checked').value;
            const lblType1 = document.getElementById('lblType1');
            const lblType2 = document.getElementById('lblType2');
            const universalDiv = document.getElementById('divUniversalDuration');

            if (selectedType === 'type1') {
                lblType1.className = "border-2 border-blue-500 bg-blue-50/50 p-4 rounded-xl cursor-pointer flex items-start gap-3 transition";
                lblType2.className = "border-2 border-slate-200 p-4 rounded-xl cursor-pointer flex items-start gap-3 transition hover:border-slate-300";
                universalDiv.style.opacity = '1';
                document.getElementById('universalDuration').disabled = false;
            } else {
                lblType2.className = "border-2 border-indigo-500 bg-indigo-50/50 p-4 rounded-xl cursor-pointer flex items-start gap-3 transition";
                lblType1.className = "border-2 border-slate-200 p-4 rounded-xl cursor-pointer flex items-start gap-3 transition hover:border-slate-300";
                universalDiv.style.opacity = '0.5';
                document.getElementById('universalDuration').disabled = true;
            }

            // Update subject duration field states
            document.querySelectorAll('.subject-duration-input').forEach(input => {
                input.disabled = (selectedType === 'type1');
            });
        }

        function addSubjectCard(defaultName = "") {
            subjectCount++;
            const id = subjectCount;
            const selectedType = document.querySelector('input[name="testType"]:checked').value;
            const isDisabled = (selectedType === 'type1') ? 'disabled' : '';

            const sampleQuestionsStr = JSON.stringify([
                {
                    "id": "q1",
                    "question_text": "What is the square root of 144?",
                    "options": ["10", "11", "12", "14"],
                    "correct_option_index": 2,
                    "explanation": "12 * 12 = 144"
                },
                {
                    "id": "q2",
                    "question_text": "Solve: 25 + 75 = ?",
                    "options": ["90", "100", "110", "120"],
                    "correct_option_index": 1,
                    "explanation": "25 + 75 = 100"
                }
            ], null, 2);

            const cardHtml = `
                <div id="subjectCard_${id}" class="subject-card border border-slate-200 bg-slate-50/50 rounded-xl p-5 relative shadow-sm">
                    <div class="flex items-center justify-between mb-3 border-b border-slate-200 pb-2">
                        <span class="font-bold text-sm text-slate-700 flex items-center gap-2">
                            <i class="fa-solid fa-book-bookmark text-blue-500"></i> Subject #${id}
                        </span>
                        <button onclick="removeSubjectCard(${id})" class="text-red-500 hover:text-red-700 text-xs font-semibold flex items-center gap-1">
                            <i class="fa-solid fa-trash"></i> Remove
                        </button>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Subject Name *</label>
                            <input type="text" class="subject-name w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white focus:ring-2 focus:ring-blue-500 outline-none" value="${defaultName}" placeholder="e.g. Mathematics">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Subject Duration (Mins) <span class="text-xs text-indigo-600">(Type 2 only)</span></label>
                            <input type="number" class="subject-duration subject-duration-input w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white focus:ring-2 focus:ring-blue-500 outline-none" ${isDisabled} value="20" placeholder="e.g. 20">
                        </div>
                    </div>

                    <div>
                        <div class="flex items-center justify-between mb-1">
                            <label class="block text-xs font-semibold text-slate-600">Questions JSON Array *</label>
                            <button onclick="insertSampleQuestions(${id})" class="text-xs text-blue-600 hover:text-blue-800 font-semibold underline">
                                Insert Sample Format
                            </button>
                        </div>
                        <textarea id="qJson_${id}" rows="6" placeholder="Paste array of question objects here..." class="subject-questions w-full p-3 font-mono text-xs bg-white border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">${sampleQuestionsStr}</textarea>
                    </div>
                </div>
            `;

            document.getElementById('subjectsContainer').insertAdjacentHTML('beforeend', cardHtml);
        }

        function removeSubjectCard(id) {
            const card = document.getElementById(`subjectCard_${id}`);
            if (card) card.remove();
        }

        function insertSampleQuestions(id) {
            const sample = [
                {
                    "id": "q1",
                    "question_text": "Sample Question Text Here?",
                    "options": ["Option A", "Option B", "Option C", "Option D"],
                    "correct_option_index": 0,
                    "explanation": "Detailed explanation of option A."
                }
            ];
            document.getElementById(`qJson_${id}`).value = JSON.stringify(sample, null, 2);
        }

        function buildDataObject() {
            const testType = document.querySelector('input[name="testType"]:checked').value;
            const title = document.getElementById('testTitle').value.trim();
            const description = document.getElementById('testDesc').value.trim();
            const categoryId = document.getElementById('categoryId').value.trim();
            const topicId = document.getElementById('topicId').value.trim();
            const isSubjectTimerEnabled = (testType === 'type2');

            if (!title) {
                showStatus("Please enter Test Title!", "error");
                return null;
            }

            let universalDuration = parseInt(document.getElementById('universalDuration').value) || 0;

            const subjectCards = document.querySelectorAll('.subject-card');
            if (subjectCards.length === 0) {
                showStatus("Please add at least one subject!", "error");
                return null;
            }

            const subjectsArray = [];
            let totalCalculatedDuration = 0;

            for (let i = 0; i < subjectCards.length; i++) {
                const card = subjectCards[i];
                const subjectName = card.querySelector('.subject-name').value.trim();
                const subjectDuration = parseInt(card.querySelector('.subject-duration').value) || 0;
                const questionsRaw = card.querySelector('.subject-questions').value.trim();

                if (!subjectName) {
                    showStatus(`Subject #${i + 1} name is required!`, "error");
                    return null;
                }

                let questionsObj = [];
                try {
                    questionsObj = JSON.parse(questionsRaw);
                    if (!Array.isArray(questionsObj)) {
                        throw new Error("Must be a JSON array");
                    }
                } catch (e) {
                    showStatus(`Invalid Questions JSON in Subject #${i + 1}: ${e.message}`, "error");
                    return null;
                }

                totalCalculatedDuration += subjectDuration;

                subjectsArray.push({
                    "id": "sub_" + (i + 1),
                    "subject_name": subjectName,
                    "duration": (testType === 'type2') ? subjectDuration : 0,
                    "questions_json": questionsObj
                });
            }

            const finalDuration = (testType === 'type1') ? universalDuration : totalCalculatedDuration;

            const questionsJsonObject = {
                "test_type": testType,
                "is_subject_timer_enabled": isSubjectTimerEnabled,
                "subjects": subjectsArray
            };

            const finalData = {
                "title": title,
                "description": description,
                "duration": finalDuration,
                "test_type": testType,
                "is_subject_timer_enabled": isSubjectTimerEnabled,
                "questions_json": questionsJsonObject,
                "subjects": subjectsArray
            };

            if (categoryId) finalData["category_id"] = categoryId;
            if (topicId) finalData["topic_id"] = topicId;

            return finalData;
        }

        function generateJSON() {
            const data = buildDataObject();
            if (data) {
                document.getElementById('outputJson').value = JSON.stringify(data, null, 2);
                showStatus("JSON Generated Successfully!", "success");
            }
        }

        function copyJSON() {
            const textarea = document.getElementById('outputJson');
            if (!textarea.value) {
                generateJSON();
            }
            if (textarea.value) {
                navigator.clipboard.writeText(textarea.value);
                showStatus("JSON Copied to Clipboard!", "success");
            }
        }

        async function uploadToSupabase() {
            let sbUrl = document.getElementById('sbUrl').value.trim();
            const sbKey = document.getElementById('sbKey').value.trim();
            const sbTable = document.getElementById('sbTable').value.trim() || 'mockup_tests';

            if (!sbUrl || !sbKey) {
                showStatus("Please enter your Supabase URL and Anon Key at the top!", "error");
                return;
            }

            const data = buildDataObject();
            if (!data) return;

            document.getElementById('outputJson').value = JSON.stringify(data, null, 2);

            showStatus("Uploading to Supabase...", "info");

            try {
                // Clean and normalize URL to prevent duplicate /rest/v1 paths or trailing slashes
                let cleanUrl = sbUrl.replace(/\/+$/, '');
                if (cleanUrl.endsWith('/rest/v1')) {
                    cleanUrl = cleanUrl.substring(0, cleanUrl.length - 8);
                }
                const endpoint = `${cleanUrl}/rest/v1/${sbTable}`;

                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'apikey': sbKey,
                        'Authorization': `Bearer ${sbKey}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=representation'
                    },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    const result = await response.json();
                    showStatus("Successfully Uploaded Test to Supabase!", "success");
                } else {
                    const errText = await response.text();
                    showStatus(`Upload Failed (${response.status}): ${errText}`, "error");
                }
            } catch (err) {
                showStatus(`Network/Upload Error: ${err.message}`, "error");
            }
        }

        function showStatus(msg, type) {
            const alert = document.getElementById('statusAlert');
            alert.classList.remove('hidden', 'bg-red-100', 'text-red-800', 'bg-emerald-100', 'text-emerald-800', 'bg-blue-100', 'text-blue-800');

            if (type === 'error') {
                alert.classList.add('bg-red-100', 'text-red-800');
            } else if (type === 'success') {
                alert.classList.add('bg-emerald-100', 'text-emerald-800');
            } else {
                alert.classList.add('bg-blue-100', 'text-blue-800');
            }

            alert.innerHTML = msg;
        }
    </script>
</body>
</html>
